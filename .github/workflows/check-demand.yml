name: Check search demand (no publish)

# 글을 발행하지 않고, 오늘 검색량 상위 후보만 확인한다.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Top candidates
        env:
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET: ${{ secrets.NAVER_AD_SECRET }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.parse
          # GitHub 는 알림을 10개까지만 보여 주므로 연결 상태를 먼저, 후보는 5개만 찍는다
          k = os.environ.get("PIXABAY_API_KEY", "").strip()
          if not k:
              print("::notice title=Pixabay 연결::Secrets 없음 (PIXABAY_API_KEY)")
          else:
              try:
                  r = urllib.request.Request("https://pixabay.com/api/?" + urllib.parse.urlencode(
                      {"key": k, "q": "office meeting", "image_type": "photo", "per_page": 3}),
                      headers={"User-Agent": "Mozilla/5.0 (lee-blog)"})
                  d = json.loads(urllib.request.urlopen(r, timeout=20).read())
                  print(f"::notice title=Pixabay 연결::정상 ('office meeting' 사진 {d.get('totalHits', 0)}장)")
              except Exception as e:
                  print(f"::notice title=Pixabay 연결::오류 {type(e).__name__} {getattr(e, 'code', '')}")
          import demand
          c = demand.collect()
          print(f"::notice title=네이버 검색량 연결::{demand.NAVER_STATUS} / 후보 {len(c)}개")
          has = "volume" in c[0]
          for x in c[:5]:
              v = f"월 {x['volume']:,}회" if has else f"점수 {x['score']}"
              print(f"::notice title=후보::{x['query']} — {v}")
          PY
