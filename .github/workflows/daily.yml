name: Daily lee blog

on:
  schedule:
    # 22:30 UTC = 07:30 KST (아로하 07:00 과 겹치지 않게)
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "발행 방식"
        type: choice
        default: publish
        options: [publish, draft]

concurrency:
  group: lee-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum > /dev/null

      - name: Check secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          missing=""
          for n in ANTHROPIC_API_KEY BLOG_ID GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN; do
            [ -z "${!n}" ] && missing="$missing $n"
          done
          if [ -n "$missing" ]; then echo "::error::등록되지 않은 Secrets:$missing"; exit 1; fi
          echo "필수 Secrets 5개 확인됨"

      - name: Write and publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PUBLISH_MODE: ${{ inputs.mode || 'publish' }}
          IMAGE_HOSTING: github
          OUTPUT_DIR: posts
          DRAFTS_PER_DAY: "2"
          PYTHONIOENCODING: utf-8
        run: python -u run.py

      - name: Commit history
        if: always()
        run: |
          git config user.name "lee-blog-bot"
          git config user.email "actions@github.com"
          git add data/history.json data/uploaded.json posts 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "chore: run log $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main || exit 1
          done
          echo "::error::기록 푸시 실패"; exit 1
