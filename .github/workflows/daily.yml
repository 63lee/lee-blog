name: Daily lee blog

on:
  schedule:
    # 22:30 UTC = 07:30 KST (아로하 07:00 과 겹치지 않게)
    - cron: "30 22 * * *"
  workflow_dispatch:

concurrency:
  group: lee-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum > /dev/null

      - name: Check secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BLOGGER_POST_EMAIL: ${{ secrets.BLOGGER_POST_EMAIL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          # 드라이브 권한이 없으면 네이버용 원고만 빠진다 (발행은 계속). 실행 요약에 노란 경고로 띄운다.
          for n in GDRIVE_CLIENT_ID GDRIVE_CLIENT_SECRET GDRIVE_REFRESH_TOKEN; do
            [ -z "${!n}" ] && echo "::warning::$n 미등록 → 네이버용 원고가 드라이브에 저장되지 않습니다"
          done
          missing=""
          for n in ANTHROPIC_API_KEY BLOGGER_POST_EMAIL GMAIL_ADDRESS GMAIL_APP_PASSWORD; do
            [ -z "${!n}" ] && missing="$missing $n"
          done
          if [ -n "$missing" ]; then echo "::error::등록되지 않은 Secrets:$missing"; exit 1; fi
          echo "필수 Secrets 확인됨"

      - name: Write and publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET: ${{ secrets.NAVER_AD_SECRET }}
          # API 글쓰기가 막힌 계정이라 Blogger '이메일로 게시'로 올린다
          POST_VIA: email
          BLOGGER_POST_EMAIL: ${{ secrets.BLOGGER_POST_EMAIL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PUBLISH_MODE: publish
          IMAGE_HOSTING: github
          OUTPUT_DIR: posts
          DRAFTS_PER_DAY: "2"
          PYTHONIOENCODING: utf-8
          # 러너는 UTC 라 07:30 KST 실행이 전날 날짜로 저장됐다. 날짜를 한국 기준으로 맞춘다.
          TZ: Asia/Seoul
        run: python -u run.py

      - name: Commit history
        if: always()
        run: |
          git config user.name "lee-blog-bot"
          git config user.email "actions@github.com"
          for f in data/history.json data/uploaded.json data/used_photos.json posts; do
            [ -e "$f" ] && git add "$f"
          done
          git diff --staged --quiet && exit 0
          git commit -m "chore: run log $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main || exit 1
          done
          echo "::error::기록 푸시 실패"; exit 1
